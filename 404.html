<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Rewritten by `flutter build web --base-href`. GitHub Pages serves the app
       from /ASplayer/, not from the root, so this is not a plain "/". -->
  <base href="/">

  <meta charset="UTF-8">
  <!-- No `viewport-fit=cover`, and an opaque status bar rather than a
       translucent one. Together those two are what make iOS lay an installed
       app out underneath the status bar, and that is the one condition under
       which controls in this app are drawn in one place and answer taps in
       another: scrolling still works, because a drag does not care where it
       starts, while every small button quietly misses.

       The cost is that the app no longer paints edge to edge behind the status
       bar. Buttons that work are worth more than that. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keep your own songs, listen offline. soundAS plays the music you already have.">

  <!-- Installing to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soundAS">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>soundAS</title>
  <link rel="manifest" href="manifest.json">

  <!-- The app's main bundle, started now rather than when the bootstrap gets
       round to asking for it: the chain is index.html -> flutter_bootstrap.js
       -> bundle, and the bundle is a megabyte that otherwise cannot begin until
       the bootstrap has been fetched and parsed.

       Which bundle depends on the browser, because the build carries two. The
       loader picks the WebAssembly one on Chromium with WasmGC and the
       JavaScript one everywhere else — Safari included, which Flutter keeps off
       WebAssembly by default. A fixed preload of main.dart.js was right before
       the build went --wasm and wrong after: Chrome then downloaded a megabyte
       it never ran, alongside the two it needed. The test below is the
       loader's own (flutter_js/src/browser_environment.js, Flutter 3.44); it
       skips the WebGL probe, which every browser that passes the rest has.

       Same URL and same request mode the loader uses — a plain fetch() for the
       module, a script for the JS — so the browser hands this response over
       instead of making a second request. -->
  <script>
    (function () {
      var blink = navigator.vendor === 'Google Inc.' ||
        navigator.userAgent.indexOf('Edg/') !== -1;
      var wasmGC = false;
      try {
        wasmGC = WebAssembly.validate(new Uint8Array(
          [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      } catch (e) {}
      var link = document.createElement('link');
      link.rel = 'preload';
      if (blink && wasmGC) {
        link.href = 'main.dart.wasm';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
      } else {
        link.href = 'main.dart.js';
        link.as = 'script';
      }
      document.head.appendChild(link);
    })();
  </script>

  <style>
    /* The app's own near-black, painted before Flutter boots so the first frame
       is not a white flash on a dark theme.

       `position: fixed` is not decoration. Installed to the home screen on iOS,
       `overflow: hidden` does not actually stop the document from scrolling:
       the page rubber-bands a few pixels and stays there, and Flutter reads tap
       coordinates without that shift — so every button answers a little above
       where it is drawn. Pinning the document kills the scroll outright. In a
       normal browser tab the address bar absorbs the same slack, which is why
       this only ever showed up in the installed app. */
    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D0D0D;
      overflow: hidden;
      overscroll-behavior: none;
      /* No double-tap-to-zoom, so the first tap counts instead of being held
         back to see whether a second one is coming. */
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    /* A holding state while the engine downloads. Removed by the app's first
       frame, which paints over it. */
    #boot {
      position: fixed;
      inset: 0;
      /* Purely a backdrop: it must never be the thing a tap lands on. */
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 600 30px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.02em;
      color: #F2F2F2;
    }
    #boot .mark { display: flex; align-items: center; }
    #boot .as { color: #0ABAB5; }
    /* How far the first download has got. A first visit from Iran is about
       4 MB over an international link of ~100 KB/s — half a minute — and a
       pulsing dot alone for that long reads as a site that has hung. Hidden
       for the first second, so a launch from the cache never shows it. */
    #boot .load {
      width: min(240px, 70vw);
      margin-top: 28px;
      text-align: center;
      font: 500 13px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      letter-spacing: 0;
      opacity: 0.75;
    }
    #boot .load[hidden] { display: none; }
    #boot .bar {
      height: 3px;
      border-radius: 2px;
      background: rgba(10, 186, 181, 0.18);
      overflow: hidden;
      margin-bottom: 12px;
    }
    #boot .bar[hidden] { display: none; }
    #boot .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #0ABAB5;
      transition: width 0.3s ease-out;
    }
    #boot .dot {
      width: 5px;
      height: 5px;
      margin-left: 10px;
      border-radius: 50%;
      background: #0ABAB5;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1.15); }
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #FAFAFA; }
      #boot { color: #101010; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark">sound<span class="as">AS</span><span class="dot"></span></div>
    <div class="load" id="boot-load" hidden>
      <div class="bar" id="boot-track" hidden><i id="boot-bar"></i></div>
      <div id="boot-note"></div>
    </div>
  </div>
  <script>
    // The first-download progress under the logo.
    //
    // The engine and the app bundle are most of what a first visit costs, and
    // the engine comes in through fetch() — the loader compiles it as it
    // streams — so a stand-in fetch counts its bytes on the way past and hands
    // the browser the same stream. The JS bundle is a <script>, which no page
    // can watch mid-flight; it counts as done when it has arrived.
    //
    // The sizes are the build's own, written in at deploy (tool/web_output.sh).
    // They are uncompressed sizes, and the counted bytes are decompressed too,
    // so the two agree; the network moves less than either, which is why this
    // shows a percentage and never a megabyte figure. A local run has no sizes
    // and shows the note alone.
    (function () {
      var sizes = {"main.dart.js":3440937,"main.dart.wasm":2923894,"canvaskit/canvaskit.wasm":7229467,"canvaskit/chromium/canvaskit.wasm":5760502,"canvaskit/skwasm.wasm":3580947,"canvaskit/skwasm_heavy.wasm":5172643,"canvaskit/wimp.wasm":3514508}/*sizes*/;
      var fa = false;
      try {
        var saved = localStorage.getItem('flutter.language');
        fa = saved ? saved.indexOf('fa') !== -1 : /^fa\b/i.test(navigator.language || '');
      } catch (e) {}
      var box = document.getElementById('boot-load');
      var track = document.getElementById('boot-track');
      var bar = document.getElementById('boot-bar');
      var note = document.getElementById('boot-note');
      var want = {}, got = {}, over = false;

      var base = new URL('.', document.baseURI).pathname;
      function key(url) {
        try {
          var path = new URL(url, document.baseURI).pathname;
          return path.indexOf(base) === 0 ? path.slice(base.length) : null;
        } catch (e) {
          return null;
        }
      }
      function digits(n) {
        var s = String(n);
        return fa ? s.replace(/\d/g, function (d) { return '۰۱۲۳۴۵۶۷۸۹'[d]; }) : s;
      }
      function draw() {
        if (over) return;
        var total = 0, have = 0;
        for (var k in want) {
          total += want[k];
          have += Math.min(got[k] || 0, want[k]);
        }
        var head = fa
          ? 'بار اول برنامه دانلود می‌شود؛ دفعه‌های بعد فوری باز می‌شود.'
          : 'First visit: the app is downloading. Next time it opens at once.';
        if (!total) {
          note.textContent = head;
          return;
        }
        var pct = Math.floor(have / total * 100);
        track.hidden = false;
        bar.style.width = pct + '%';
        note.textContent = have >= total
          ? (fa ? 'در حال آماده‌سازی…' : 'Getting ready…')
          : head + '\n' + (fa ? digits(pct) + '٪' : pct + '%');
      }
      note.style.whiteSpace = 'pre-line';
      if (fa) note.dir = 'rtl';

      function expect(k) {
        if (sizes && sizes[k] && !(k in want)) want[k] = sizes[k];
      }
      // The bundle the head chose to preload is the one this browser will run.
      var preload = document.querySelector('link[rel="preload"]');
      if (preload) expect(key(preload.href));

      // Arrival of anything watched only as a whole (the JS bundle).
      try {
        new PerformanceObserver(function (list) {
          list.getEntries().forEach(function (e) {
            var k = key(e.name);
            if (k in want) { got[k] = want[k]; draw(); }
          });
        }).observe({type: 'resource', buffered: true});
      } catch (e) {}

      var plain = window.fetch;
      if (plain && window.ReadableStream && sizes) {
        window.fetch = function (input) {
          var pending = plain.apply(this, arguments);
          var k = over ? null : key(typeof input === 'string' ? input : input && input.url);
          if (!k || !sizes[k]) return pending;
          expect(k);
          draw();
          return pending.then(function (res) {
            // Anything unexpected and the browser gets the response untouched:
            // a progress bar is never worth a launch that fails.
            if (!res.ok || !res.body) return res;
            try {
              var reader = res.body.getReader();
              var counted = new ReadableStream({
                pull: function (out) {
                  return reader.read().then(function (r) {
                    if (r.done) {
                      got[k] = want[k];
                      draw();
                      out.close();
                      return;
                    }
                    got[k] = (got[k] || 0) + r.value.byteLength;
                    draw();
                    out.enqueue(r.value);
                  }, function (e) { out.error(e); });
                },
                cancel: function (why) { return reader.cancel(why); }
              });
              // Same status and headers — application/wasm included, which is
              // what lets the loader compile it while it streams.
              return new Response(counted, {
                status: res.status,
                statusText: res.statusText,
                headers: res.headers
              });
            } catch (e) {
              return res;
            }
          });
        };
      }

      // Only a slow launch is told anything.
      setTimeout(function () {
        if (!over && document.getElementById('boot')) {
          box.hidden = false;
          draw();
        }
      }, 1000);

      // Called once the app has drawn: hand fetch back, stop counting.
      window.soundasBooted = function () {
        over = true;
        if (window.fetch !== plain && plain) window.fetch = plain;
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Take the holding state out of the document once Flutter has put its own
    // view in, rather than leaving it underneath forever.
    new MutationObserver(function (records, observer) {
      if (!document.querySelector('flutter-view, flt-glass-pane')) return;
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
      observer.disconnect();
      if (window.soundasBooted) window.soundasBooted();
      keepForNextLaunch();
    }).observe(document.body, {childList: true, subtree: true});

    // What a first visit downloaded, handed to the worker to keep.
    //
    // The worker registers only after the page has loaded, so the engine and
    // the bundle come down before it is there to see them, and the next launch
    // found them in nothing but the browser's HTTP cache — which an iPhone
    // trims as it likes, sending a second visit back for the same 4 MB. Once
    // the app is up, the worker is given the list and stores each file; the
    // copy it fetches comes out of that HTTP cache, not off the network.
    function keepForNextLaunch() {
      if (!('serviceWorker' in navigator) || !window.performance) return;
      var base = new URL('.', document.baseURI).pathname;
      var urls = performance.getEntriesByType('resource')
        .map(function (e) { return e.name; })
        .filter(function (u) {
          var p;
          try { p = new URL(u); } catch (e) { return false; }
          if (p.origin !== location.origin || p.search) return false;
          var path = p.pathname.slice(base.length);
          return /^(main\.dart\.|flutter|canvaskit\/|assets\/)/.test(path);
        });
      if (!urls.length) return;
      navigator.serviceWorker.ready.then(function (reg) {
        if (reg.active) reg.active.postMessage({keep: urls});
      }).catch(function () {});
    }
  </script>
  <script>
    // Frame-rate readout, only when the URL asks for it (?fps=1). Jank is a
    // phone problem and the phone is the one place it cannot be profiled from
    // here, so this reports the number instead of guessing at it: worst frame
    // over the last second, which is what a stutter actually is — an average
    // stays comfortable while every tenth frame takes 200 ms.
    if (location.search.indexOf('fps=1') !== -1) {
      var box = document.createElement('div');
      box.style.cssText =
        'position:fixed;top:0;left:0;z-index:2147483647;background:rgba(0,0,0,.75);' +
        'color:#0ABAB5;font:600 12px/1.4 monospace;padding:4px 7px;pointer-events:none;' +
        'border-bottom-right-radius:8px;white-space:pre';
      document.documentElement.appendChild(box);
      var last = performance.now(), frames = 0, worst = 0, since = last;
      requestAnimationFrame(function tick(now) {
        var gap = now - last;
        last = now;
        frames++;
        if (gap > worst) worst = gap;
        if (now - since >= 1000) {
          box.textContent =
            frames + ' fps   badtarin ' + worst.toFixed(0) + ' ms';
          frames = 0; worst = 0; since = now;
        }
        requestAnimationFrame(tick);
      });
    }
  </script>
  <script>
    // Our own worker (see sw.js). Registered after load so it never competes
    // with the engine download on a first visit — offline only has to work from
    // the second launch onwards.
    //
    // updateViaCache 'none': the worker script itself must never come from the
    // HTTP cache. Its contents are how a new release is noticed at all — the
    // cache name inside it carries the build — so a stale copy would pin the
    // app to an old version.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('sw.js', {updateViaCache: 'none'})
          .catch(function (e) {
            console.warn('[sw] registration failed', e);
          });
      });
    }
  </script>
</body>
</html>
