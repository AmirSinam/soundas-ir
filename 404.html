<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Rewritten by `flutter build web --base-href`. GitHub Pages serves the app
       from /ASplayer/, not from the root, so this is not a plain "/". -->
  <base href="/">

  <meta charset="UTF-8">
  <!-- No `viewport-fit=cover`, and an opaque status bar rather than a
       translucent one. Together those two are what make iOS lay an installed
       app out underneath the status bar, and that is the one condition under
       which controls in this app are drawn in one place and answer taps in
       another: scrolling still works, because a drag does not care where it
       starts, while every small button quietly misses.

       The cost is that the app no longer paints edge to edge behind the status
       bar. Buttons that work are worth more than that. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keep your own songs, listen offline. soundAS plays the music you already have.">

  <!-- Installing to the home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soundAS">
  <meta name="theme-color" content="#0D0D0D">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>soundAS</title>
  <link rel="manifest" href="manifest.json">

  <!-- The app's main bundle, started now rather than when the bootstrap gets
       round to asking for it: the chain is index.html -> flutter_bootstrap.js
       -> bundle, and the bundle is a megabyte that otherwise cannot begin until
       the bootstrap has been fetched and parsed.

       Which bundle depends on the browser, because the build carries two. The
       loader picks the WebAssembly one on Chromium with WasmGC and the
       JavaScript one everywhere else — Safari included, which Flutter keeps off
       WebAssembly by default. A fixed preload of main.dart.js was right before
       the build went --wasm and wrong after: Chrome then downloaded a megabyte
       it never ran, alongside the two it needed. The test below is the
       loader's own (flutter_js/src/browser_environment.js, Flutter 3.44); it
       skips the WebGL probe, which every browser that passes the rest has.

       Same URL and same request mode the loader uses — a plain fetch() for the
       module, a script for the JS — so the browser hands this response over
       instead of making a second request. -->
  <script>
    (function () {
      var blink = navigator.vendor === 'Google Inc.' ||
        navigator.userAgent.indexOf('Edg/') !== -1;
      var wasmGC = false;
      try {
        wasmGC = WebAssembly.validate(new Uint8Array(
          [0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
      } catch (e) {}
      var link = document.createElement('link');
      link.rel = 'preload';
      if (blink && wasmGC) {
        link.href = 'main.dart.wasm';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
      } else {
        link.href = 'main.dart.js';
        link.as = 'script';
      }
      document.head.appendChild(link);
    })();
  </script>

  <style>
    /* The app's own near-black, painted before Flutter boots so the first frame
       is not a white flash on a dark theme.

       `position: fixed` is not decoration. Installed to the home screen on iOS,
       `overflow: hidden` does not actually stop the document from scrolling:
       the page rubber-bands a few pixels and stays there, and Flutter reads tap
       coordinates without that shift — so every button answers a little above
       where it is drawn. Pinning the document kills the scroll outright. In a
       normal browser tab the address bar absorbs the same slack, which is why
       this only ever showed up in the installed app. */
    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0D0D0D;
      overflow: hidden;
      overscroll-behavior: none;
      /* No double-tap-to-zoom, so the first tap counts instead of being held
         back to see whether a second one is coming. */
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
    /* A holding state while the engine downloads. Removed by the app's first
       frame, which paints over it. */
    #boot {
      position: fixed;
      inset: 0;
      /* Purely a backdrop: it must never be the thing a tap lands on. */
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 30px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.02em;
      color: #F2F2F2;
    }
    #boot .as { color: #0ABAB5; }
    #boot .dot {
      width: 5px;
      height: 5px;
      margin-left: 10px;
      border-radius: 50%;
      background: #0ABAB5;
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50%      { opacity: 1;    transform: scale(1.15); }
    }
    @media (prefers-color-scheme: light) {
      html, body { background: #FAFAFA; }
      #boot { color: #101010; }
    }
  </style>
</head>
<body>
  <div id="boot">sound<span class="as">AS</span><span class="dot"></span></div>
  <script>
    // Volume where the browser will not set it — iPhone Safari.
    //
    // iOS ignores HTMLMediaElement.volume: it can be written, and reads back 1.
    // The crossfade ramps both decks' volume, so on an iPhone the next song came
    // in at full level and the old one stayed at full until it was cut. The only
    // volume iOS lets a page control is a Web Audio gain, so this routes each
    // audio element through one — element -> GainNode -> speakers — and makes
    // the element's own `volume` property drive that gain. The player above
    // keeps calling setVolume exactly as before and never knows.
    //
    // Only where it is needed (probed, not guessed from the user agent), and
    // only once the app turns it on — which it does only while crossfade and
    // the separate, off-by-default "smooth fade on iPhone" switch are both on.
    // On by itself with crossfade it left the next song silent on an iPhone.
    // Web Audio on iOS is suspected of going quiet when the screen locks, and
    // the lock screen is where this app is used most; a setting the user can
    // turn off is the safe way to find out. Routing cannot be undone on an
    // element, so turning crossfade off takes effect the next time the app is
    // opened. `soundasFade.log()` is what the playback log in Settings appends.
    (function () {
      var desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'volume');
      var needed = false;
      try {
        var probe = document.createElement('audio');
        probe.volume = 0.5;
        needed = Math.abs(probe.volume - 0.5) > 0.01;
      } catch (e) {}
      // For testing the bridge in a browser that does not need it.
      try { if (localStorage.getItem('soundas.forceFadeRoute') === '1') needed = true; } catch (e) {}

      var on = false, ctx = null, seen = [], lines = [];
      function note(m) {
        lines.push(new Date().toISOString().slice(11, 23) + ' fade: ' + m);
        if (lines.length > 100) lines.shift();
      }
      function context() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          ctx = new AC();
          ctx.onstatechange = function () { note('audio engine ' + ctx.state); };
          note('audio engine created, ' + ctx.state);
        }
        return ctx;
      }
      function wake() {
        if (ctx && ctx.state !== 'running') {
          ctx.resume().catch(function (e) { note('resume refused: ' + e); });
        }
      }
      // Listens to what actually comes out of a routed deck, and says so when
      // a deck is playing but nothing reaches the speakers. That is how the
      // bridge failed on an iPhone — the next song played, silently — and it
      // is the line the playback log needs to say why.
      function watch(el, gain, c) {
        try {
          var probe = c.createAnalyser();
          probe.fftSize = 512;
          var sink = c.createGain();
          sink.gain.value = 0;
          gain.connect(probe);
          probe.connect(sink);
          sink.connect(c.destination);
          var buf = new Float32Array(probe.fftSize);
          var quiet = 0, said = '';
          setInterval(function () {
            if (el.paused || el.__soundasVol === 0) { quiet = 0; return; }
            probe.getFloatTimeDomainData(buf);
            var peak = 0;
            for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i]));
            quiet = peak < 0.0005 ? quiet + 1 : 0;
            var now = quiet >= 3 ? 'silent' : 'sounding';
            if (now !== said) {
              said = now;
              note('deck ' + now + ' (engine ' + c.state + ', at ' + el.currentTime.toFixed(1) + 's)');
            }
          }, 700);
        } catch (e) {
          note('could not watch a deck: ' + e);
        }
      }

      function route(el) {
        if (el.__soundasGain) return;
        try {
          var c = context();
          var source = c.createMediaElementSource(el);
          var gain = c.createGain();
          gain.gain.value = el.__soundasVol == null ? 1 : el.__soundasVol;
          source.connect(gain);
          gain.connect(c.destination);
          el.__soundasGain = gain;
          watch(el, gain, c);
          // From here the gain is the only volume. The element's own level is
          // set to full and left there: where the browser honours it, a deck
          // set to 0 before it was routed would otherwise feed silence into
          // the gain for good. (iOS ignores it either way.)
          desc.set.call(el, 1);
          note('deck routed');
        } catch (e) {
          note('routing failed: ' + e);
        }
      }

      if (needed) {
        Object.defineProperty(HTMLMediaElement.prototype, 'volume', {
          configurable: true,
          enumerable: desc.enumerable,
          get: function () {
            if (!this.__soundasGain) return desc.get.call(this);
            return this.__soundasVol == null ? 1 : this.__soundasVol;
          },
          set: function (v) {
            // Kept even before routing, so a deck set to 0 ahead of its first
            // play starts silent once it is routed.
            this.__soundasVol = v;
            var g = this.__soundasGain;
            if (g) {
              // A short glide rather than a jump: the ramp steps every 33 ms,
              // and raw steps on a gain are audible as zipper noise.
              g.gain.setTargetAtTime(v, g.context.currentTime, 0.015);
            } else {
              desc.set.call(this, v);
            }
          }
        });
        // Every audio element is known from the moment it is made, not from
        // its first play. The second deck first plays when the next song
        // starts by itself — no finger on the screen — and routed then, it
        // came out silent on an iPhone: Safari lets audio be wired up only
        // inside a user's tap. So the first tap that plays anything wires up
        // every deck there is, the second one included.
        var create = Document.prototype.createElement;
        Document.prototype.createElement = function (tag) {
          var el = create.apply(this, arguments);
          if (String(tag).toLowerCase() === 'audio' && seen.indexOf(el) < 0) {
            seen.push(el);
          }
          return el;
        };
        var play = HTMLMediaElement.prototype.play;
        HTMLMediaElement.prototype.play = function () {
          if (this instanceof HTMLAudioElement) {
            if (seen.indexOf(this) < 0) seen.push(this);
            if (on) {
              for (var i = 0; i < seen.length; i++) route(seen[i]);
              wake();
            }
          }
          return play.apply(this, arguments);
        };
        document.addEventListener('visibilitychange', function () {
          if (!ctx) return;
          note('page ' + document.visibilityState + ', audio engine ' + ctx.state);
          wake();
        });
      }

      window.soundasFade = {
        needed: needed,
        enable: function () {
          if (!needed || on) return;
          on = true;
          note('turned on');
          // Every deck is routed now, so the very first crossfade can lower the
          // song playing at this moment and raise the one after it.
          for (var i = 0; i < seen.length; i++) route(seen[i]);
          wake();
        },
        log: function () { return lines.join('\n'); }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Take the holding state out of the document once Flutter has put its own
    // view in, rather than leaving it underneath forever.
    new MutationObserver(function (records, observer) {
      if (!document.querySelector('flutter-view, flt-glass-pane')) return;
      var boot = document.getElementById('boot');
      if (boot) boot.remove();
      observer.disconnect();
    }).observe(document.body, {childList: true, subtree: true});
  </script>
  <script>
    // Frame-rate readout, only when the URL asks for it (?fps=1). Jank is a
    // phone problem and the phone is the one place it cannot be profiled from
    // here, so this reports the number instead of guessing at it: worst frame
    // over the last second, which is what a stutter actually is — an average
    // stays comfortable while every tenth frame takes 200 ms.
    if (location.search.indexOf('fps=1') !== -1) {
      var box = document.createElement('div');
      box.style.cssText =
        'position:fixed;top:0;left:0;z-index:2147483647;background:rgba(0,0,0,.75);' +
        'color:#0ABAB5;font:600 12px/1.4 monospace;padding:4px 7px;pointer-events:none;' +
        'border-bottom-right-radius:8px;white-space:pre';
      document.documentElement.appendChild(box);
      var last = performance.now(), frames = 0, worst = 0, since = last;
      requestAnimationFrame(function tick(now) {
        var gap = now - last;
        last = now;
        frames++;
        if (gap > worst) worst = gap;
        if (now - since >= 1000) {
          box.textContent =
            frames + ' fps   badtarin ' + worst.toFixed(0) + ' ms';
          frames = 0; worst = 0; since = now;
        }
        requestAnimationFrame(tick);
      });
    }
  </script>
  <script>
    // Our own worker (see sw.js). Registered after load so it never competes
    // with the engine download on a first visit — offline only has to work from
    // the second launch onwards.
    //
    // updateViaCache 'none': the worker script itself must never come from the
    // HTTP cache. Its contents are how a new release is noticed at all — the
    // cache name inside it carries the build — so a stale copy would pin the
    // app to an old version.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('sw.js', {updateViaCache: 'none'})
          .catch(function (e) {
            console.warn('[sw] registration failed', e);
          });
      });
    }
  </script>
</body>
</html>
